<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - BISECO Election</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0044cc" />
  </head>
  <body>
    <nav>
      <div class="container nav-inner">
        <a href="/" class="logo">
          <img src="/images/logo.png" alt="BISECO" style="height: 45px" />
          <span class="logo-text">BISECO<br /><small>Prefectorial Election</small></span>
        </a>
        <div class="nav-links">
          <a href="/">Home</a>
          <button class="dark-toggle" onclick="toggleDark()" aria-label="Toggle dark mode"></button>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        <div class="auth-card">
          <img src="/images/logo.png" alt="BISECO" class="auth-logo" />
          <h2>Admin Login</h2>
          <p class="auth-subtitle">Enter your admin code and password</p>
          <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
              <label for="code">Admin Code</label>
              <input
                type="text"
                id="code"
                placeholder="Enter admin code"
                required
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="pw-group">
                <input type="password" id="password" placeholder="Enter password" required />
                <button type="button" class="pw-toggle" onclick="togglePassword('password')">
                  &#128065;
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="login-btn">Login</button>
          </form>
          <p style="text-align: center; margin-top: 15px">
            <a href="/admin/forgot-password" style="color: var(--accent)">Forgot password?</a>
          </p>
        </div>
      </div>
    </section>

    <footer>
      <div class="container">
        <div class="footer-bottom">
          &copy; 2026 Bisease Senior High School (BISECO). All rights reserved
        </div>
      </div>
    </footer>

    <div class="toast" id="toast"></div>
    <script src="/js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        try {
          const user = await fetchJSON('/api/auth/me');
          if (user.role === 'admin') window.location.href = '/admin';
        } catch (e) {}
      });

      async function handleAdminLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        btn.textContent = 'Logging in...';
        try {
          const data = await fetchJSON('/api/auth/admin/login', {
            method: 'POST',
            body: JSON.stringify({
              code: document.getElementById('code').value,
              password: document.getElementById('password').value,
            }),
          });
          if (data.requires2FA) {
            window.location.href = '/admin/2fa-setup';
            return;
          }
          toast('Login successful!', 'success');
          setTimeout(() => {
            window.location.href = '/admin';
          }, 500);
        } catch (err) {
          toast(err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Login';
        }
      }
    </script>
  </body>
</html>
