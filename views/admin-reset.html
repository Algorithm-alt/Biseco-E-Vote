<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - BISECO Election</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0044cc" />
  </head>
  <body>
    <nav>
      <div class="container nav-inner">
        <a href="/" class="logo">
          <img src="/images/logo.png" alt="BISECO" style="height: 45px" />
          <span class="logo-text">BISECO<br /><small>Prefectorial Election</small></span>
        </a>
        <div class="nav-links">
          <a href="/admin/login">Back to Login</a>
          <button class="dark-toggle" onclick="toggleDark()" aria-label="Toggle dark mode"></button>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        <div class="auth-card" id="reset-card">
          <img src="/images/logo.png" alt="BISECO" class="auth-logo" />
          <h2>Set New Password</h2>
          <p class="auth-subtitle">Choose a new password for your admin account</p>
          <form id="reset-form" onsubmit="handleReset(event)">
            <div class="form-group">
              <label for="password">New Password</label>
              <div class="pw-group">
                <input
                  type="password"
                  id="password"
                  placeholder="At least 8 characters"
                  minlength="8"
                  required
                />
                <button type="button" class="pw-toggle" onclick="togglePassword('password')">
                  &#128065;
                </button>
              </div>
            </div>
            <div class="form-group">
              <label for="confirm-password">Confirm New Password</label>
              <div class="pw-group">
                <input
                  type="password"
                  id="confirm-password"
                  placeholder="Re-enter password"
                  minlength="8"
                  required
                />
                <button
                  type="button"
                  class="pw-toggle"
                  onclick="togglePassword('confirm-password')"
                >
                  &#128065;
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="reset-btn">
              Reset Password
            </button>
          </form>
          <p style="text-align: center; margin-top: 15px">
            <a href="/admin/login" style="color: var(--accent)">Back to Login</a>
          </p>
        </div>
      </div>
    </section>

    <footer>
      <div class="container">
        <div class="footer-bottom">
          &copy; 2026 Bisease Senior High School (BISECO). All rights reserved
        </div>
      </div>
    </footer>

    <div class="toast" id="toast"></div>
    <script src="/js/app.js"></script>
    <script>
      function getToken() {
        return new URLSearchParams(window.location.search).get('token') || '';
      }

      async function handleReset(e) {
        e.preventDefault();
        const pw = document.getElementById('password').value;
        const cpw = document.getElementById('confirm-password').value;
        if (pw !== cpw) {
          toast('Passwords do not match', 'error');
          return;
        }
        const btn = document.getElementById('reset-btn');
        btn.disabled = true;
        btn.textContent = 'Resetting...';
        try {
          await fetchJSON('/api/auth/admin/reset-password', {
            method: 'POST',
            body: JSON.stringify({ token: getToken(), newPassword: pw }),
          });
          document.getElementById('reset-card').innerHTML =
            '<div class="status-badge status-voted">Password reset successful!</div><p style="margin-top:15px;color:var(--text-secondary);">You can now login with your new password.</p><p style="text-align:center;margin-top:15px;"><a href="/admin/login" class="btn btn-primary">Go to Admin Login</a></p>';
        } catch (err) {
          toast(err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        }
      }

      if (!getToken()) {
        document.getElementById('reset-card').innerHTML =
          '<h2>Invalid Reset Link</h2><p style="color:var(--danger);">This reset link is missing or invalid. Request a new one.</p><p style="text-align:center;margin-top:15px;"><a href="/admin/forgot-password" class="btn btn-primary">Request New Link</a></p>';
      }
    </script>
  </body>
</html>
