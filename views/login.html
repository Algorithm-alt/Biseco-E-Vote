<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BISECO Election</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e3a5f">
</head>
<body>
  <nav>
    <div class="container nav-inner">
      <a href="/" class="logo">
        <img src="/images/logo.png" alt="BISECO" style="height:45px;">
        <span class="logo-text">BISECO<br><small>Prefectorial Election</small></span>
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
        <button class="dark-toggle" onclick="toggleDark()" aria-label="Toggle dark mode"></button>
      </div>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <div class="auth-card">
        <img src="/images/logo.png" alt="BISECO" class="auth-logo">
        <h2>Login to Vote</h2>
        <p class="auth-subtitle">Enter the voting code given to you by your admin</p>
        <form id="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="code">Voting Code</label>
            <input type="text" id="code" placeholder="e.g. Ab3xK9mQ" required autocomplete="off" style="font-family:monospace;font-size:1.2rem;letter-spacing:2px;text-align:center;">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="login-btn">Login</button>
        </form>
        <div class="auth-link" style="margin-top:20px;">
          <a href="/admin/login">Admin Login</a>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="footer-bottom">&copy; 2026 Bisease Senior High School (BISECO). All rights reserved</div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const user = await fetchJSON('/api/auth/me');
        if (user.role === 'admin') window.location.href = '/admin';
        else window.location.href = '/ballot';
      } catch(e) {}
    });

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Logging in...';
      try {
        const data = await fetchJSON('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ code: document.getElementById('code').value })
        });
        toast('Login successful!', 'success');
        setTimeout(() => { window.location.href = data.user.role === 'admin' ? '/admin' : '/ballot'; }, 500);
      } catch(err) {
        toast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Login';
      }
    }
  </script>
</body>
</html>
