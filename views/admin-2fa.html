<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2FA Setup - BISECO Election</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0044cc">
</head>
<body>
  <nav>
    <div class="container nav-inner">
      <a href="/" class="logo">
        <img src="/images/logo.png" alt="BISECO" style="height:45px;">
        <span class="logo-text">BISECO<br><small>Prefectorial Election</small></span>
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
        <button class="dark-toggle" onclick="toggleDark()" aria-label="Toggle dark mode"></button>
      </div>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <div class="auth-card" id="twofa-card">
        <div class="loading-placeholder"><div class="spinner"></div><p>Checking status...</p></div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="footer-bottom">&copy; 2026 Bisease Senior High School (BISECO). All rights reserved</div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="/js/app.js"></script>
  <script>
    let step = 'verify';

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const user = await fetchJSON('/api/auth/me');
        if (user.role !== 'admin') { window.location.href = '/login'; return; }
        if (!user.totp_enabled) {
          showSetup();
        } else {
          showVerify();
        }
      } catch(e) {
        showVerify();
      }
    });

    function showSetup() {
      step = 'setup';
      document.getElementById('twofa-card').innerHTML = `
        <img src="/images/logo.png" alt="BISECO" class="auth-logo">
        <h2>Setup 2FA</h2>
        <p class="auth-subtitle">Scan this QR code with your authenticator app</p>
        <div id="qr-container" style="margin:20px 0;"><div class="loading-placeholder"><div class="spinner"></div></div></div>
        <div id="manual-secret" style="margin:10px 0;"></div>
        <form onsubmit="enable2FA(event)">
          <div class="form-group">
            <label>Enter the 6-digit code from your app</label>
            <input type="text" id="totp-token" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required style="text-align:center;font-size:1.5rem;letter-spacing:8px;font-family:monospace;">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="enable-btn">Enable 2FA</button>
        </form>
        <div style="margin-top:15px;"><a href="/admin" class="btn btn-outline btn-block">Skip for now</a></div>`;
      loadQRCode();
    }

    async function loadQRCode() {
      try {
        const data = await fetchJSON('/api/auth/admin/2fa-setup', { method: 'POST' });
        document.getElementById('qr-container').innerHTML = `<img src="${data.qrCode}" alt="QR Code" style="max-width:220px;border-radius:12px;box-shadow:var(--shadow);">`;
        document.getElementById('manual-secret').innerHTML = '<p style="color:var(--gray);font-size:0.85rem;">Scan the QR code above with your authenticator app.</p>';
      } catch(err) {
        document.getElementById('qr-container').innerHTML = '<p style="color:red;">Failed to load QR code</p>';
      }
    }

    async function enable2FA(e) {
      e.preventDefault();
      const btn = document.getElementById('enable-btn');
      btn.disabled = true; btn.textContent = 'Verifying...';
      try {
        await fetchJSON('/api/auth/admin/2fa-enable', {
          method: 'POST', body: JSON.stringify({ token: document.getElementById('totp-token').value })
        });
        toast('2FA enabled!', 'success');
        setTimeout(() => { window.location.href = '/admin'; }, 500);
      } catch(err) {
        toast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Enable 2FA';
      }
    }

    function showVerify() {
      step = 'verify';
      document.getElementById('twofa-card').innerHTML = `
        <img src="/images/logo.png" alt="BISECO" class="auth-logo">
        <h2>2FA Verification</h2>
        <p class="auth-subtitle">Enter the 6-digit code from your authenticator app</p>
        <form onsubmit="verify2FA(event)">
          <div class="form-group">
            <input type="text" id="totp-token" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required style="text-align:center;font-size:1.5rem;letter-spacing:8px;font-family:monospace;">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="verify-btn">Verify</button>
        </form>
        <div style="margin-top:15px;"><a href="/admin/login" style="color:var(--gray);">Back to login</a></div>`;
    }

    async function verify2FA(e) {
      e.preventDefault();
      const btn = document.getElementById('verify-btn');
      btn.disabled = true; btn.textContent = 'Verifying...';
      try {
        await fetchJSON('/api/auth/admin/2fa-verify', {
          method: 'POST', body: JSON.stringify({ token: document.getElementById('totp-token').value })
        });
        toast('Verified!', 'success');
        setTimeout(() => { window.location.href = '/admin'; }, 500);
      } catch(err) {
        toast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Verify';
      }
    }
  </script>
</body>
</html>
